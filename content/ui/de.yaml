  case-clause: "`case`-Anweisungen simuliert PenguinOps noch nicht, darum hat die Eingabe hier angehalten."
  command-group: Befehlsgruppen (`{ …; }`) simuliert PenguinOps noch nicht, darum hat die Eingabe hier angehalten.
  conditional-command: Den Testbefehl `[[ … ]]` simuliert PenguinOps noch nicht, darum hat die Eingabe hier angehalten.
  function-definition: Shell-Funktionen simuliert PenguinOps noch nicht, darum hat die Eingabe hier angehalten.
  coprocess: Koprozesse (`coproc`) simuliert PenguinOps noch nicht, darum hat die Eingabe hier angehalten.
  array: Arrays (etwa `a=(…)` oder `a[1]=…`) simuliert PenguinOps noch nicht, darum hat die Eingabe hier angehalten.
  process-id: Prozess-IDs (`$$`) simuliert PenguinOps noch nicht, darum hat die Eingabe hier angehalten.
  shell-options: Die Shell-Optionen (`$-`) simuliert PenguinOps noch nicht, darum hat die Eingabe hier angehalten.
  file-descriptor: Andere Dateideskriptoren als 0, 1 und 2 (etwa `3>`) simuliert PenguinOps noch nicht, darum hat die Eingabe hier angehalten.
  reversed-redirection: Umleitungen in diese Richtung (etwa `0>` oder `2<`) simuliert PenguinOps noch nicht, darum hat die Eingabe hier angehalten.
  command-path: Programme über ihren Pfad starten (etwa `./script.sh` oder `/bin/ls`) kann PenguinOps noch nicht, darum hat die Eingabe hier angehalten. Tippe einen Befehl nur mit seinem Namen, etwa `ls`.
help:
  overview: |-
    Du arbeitest in einem Debian-Terminal: Tippe einen Befehl und drücke Enter.

    Spielbefehle:
    - `help` zeigt diese Übersicht.
    - `help NAME` erklärt einen Befehl, etwa `help ls`.
    - `hint` zeigt den nächsten Hinweis zu deinem Ticket, wie F1.

    Tasten: Tab vervollständigt, Pfeil hoch und runter holen frühere Befehle zurück, Strg+C verwirft die Zeile, Strg+L leert den Bildschirm, Esc öffnet das Menü.
  commands: "Befehle, die du nutzen kannst:"
  unknown: Den Befehl {topic} kennt PenguinOps nicht. `help` listet die Befehle, die du nutzen kannst.
help-topics:
  cat: "`cat DATEI…` gibt den Inhalt von Dateien nacheinander aus. `cat -n` nummeriert die Zeilen."
  cd: "`cd VERZEICHNIS` wechselt das Arbeitsverzeichnis. `cd` allein bringt dich in dein Home-Verzeichnis, `cd ..` eine Ebene nach oben und `cd -` dorthin zurück, wo du vorher warst."
  clear: "`clear` leert den Bildschirm. Strg+L macht dasselbe."
  cp: "`cp QUELLE ZIEL` kopiert eine Datei. `cp -r` kopiert ein Verzeichnis mit allem, was darin ist."
  echo: "`echo TEXT` gibt seine Argumente aus, getrennt durch Leerzeichen. Mit `>` landet der Text in einer Datei: `echo hallo > notiz.txt`."
  grep: "`grep MUSTER DATEI…` gibt die Zeilen von Dateien aus, die das Muster enthalten. `grep -i` ignoriert Groß- und Kleinschreibung, `grep -r` durchsucht ganze Verzeichnisse."
  head: "`head DATEI` gibt die ersten 10 Zeilen einer Datei aus, `head -n 5` die ersten fünf."
  help: "`help` zeigt die Übersicht der Spielbefehle und Tasten, `help NAME` erklärt einen Befehl, etwa `help ls`."
  hint: "`hint` zeigt den nächsten Hinweis zu deinem Ticket, wie F1. Jedes Ticket hat drei: einen Tipp, einen konkreten Tipp und die Lösung."
  history: "`history` listet die Befehle, die du getippt hast, nummeriert auf. `history -c` leert die Liste. Pfeil hoch und runter holen frühere Befehle zurück in die Zeile."
  ls: "`ls` listet die Dateien in einem Verzeichnis auf, ohne Namen im Arbeitsverzeichnis. `ls -l` zeigt Details, `ls -a` auch die versteckten Dateien, deren Namen mit einem Punkt beginnen."
  mkdir: "`mkdir NAME` legt ein Verzeichnis an. `mkdir -p` legt auch die fehlenden Verzeichnisse darüber an."
  mv: "`mv QUELLE ZIEL` verschiebt oder benennt eine Datei oder ein Verzeichnis um."
  pwd: "`pwd` gibt das Arbeitsverzeichnis aus: wo du gerade bist."
  rm: "`rm DATEI` löscht Dateien endgültig, einen Papierkorb gibt es nicht. `rm -r` löscht ein Verzeichnis mit allem, was darin ist."
  tail: "`tail DATEI` gibt die letzten 10 Zeilen einer Datei aus, `tail -n 5` die letzten fünf."
  touch: "`touch DATEI` legt eine leere Datei an oder setzt die Zeit einer vorhandenen Datei auf jetzt."
  whoami: "`whoami` gibt den Namen deines Benutzers aus."
