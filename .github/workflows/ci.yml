# Continuous integration (ADR 0015, ADR 0027, ADR 0036): runs the quality gate on every push to
# main and on every pull request. Commands come from the npm scripts in package.json.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI never writes to the repository.
permissions:
  contents: read

# A newer push to a pull request cancels its older run. On main every commit is checked to the end,
# so that a red commit is always found.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: Linux (all checks, AppImage)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      # Ubuntu 24.04 blocks the unprivileged user namespaces that Chromium's sandbox needs; the
      # app enables the sandbox for every renderer (ADR 0014).
      - name: Allow the Chromium sandbox
        run: sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
      # Electron needs a display; xvfb-run provides a virtual one.
      - run: xvfb-run --auto-servernum npm run e2e
      - run: npm run package
      - run: xvfb-run --auto-servernum npm run e2e:packaged
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage
          path: apps/desktop/release/*.AppImage
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows (tests, installer)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run e2e
      - run: npm run package
      - run: npm run e2e:packaged
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          path: apps/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 7

  documentation-duty:
    name: Documentation duty
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The full history, so the check can compare with the commit before the push or with
          # the merge base of the pull request.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # The check has no dependencies, so no npm ci. Commit ids come through the environment,
      # never directly into the shell command.
      - name: Check that code or content changes update docs/STATUS.md
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: npm run check:docs-duty -- "$BASE" "$HEAD"
